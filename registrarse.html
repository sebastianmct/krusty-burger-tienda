<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Krusty Burger</title>
    <link rel="stylesheet" href="css/style-registrarse.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
</head>

<body>
    <main class="registro">
        <div class="columna-izquierda">
            <h1 class="titulo">¡UNETE AL CLUB DE LOS HAMBRIENTOS!</h1>
            <p class="texto">Registrate para obtener acceso exclusivo a las mejores hamburguesas del Springfield y
                promociones que
                harán
                que
                te babees</p>
            <div class="imagen-izquierda">
                <img src="assets/krusty-burger-local.webp" alt="Krusty Burger en el local">
            </div>
        </div>
        <div class="formulario-registro">
            <h2 class="formulario-titulo">Crea tu cuenta</h2>
            <form class="registro-formulario">
                <div class="formulario-grupo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" required placeholder="Ej. Homero Simpson">
                </div>
                <div class="formulario-grupo">
                    <label for="email">Tu Email de Springfield</label>
                    <input type="email" required placeholder="Ej. homero_lover@simpson.com">
                </div>
                <div class="formulario-grupo">
                    <label for="password">Contraseña Secreta</label>
                    <input type="password" required placeholder="********">
                </div>
                <label class="checkbox" for="terminos">
                    <input type="checkbox" required>
                    <span>Quiero recibir ofertas que no puedo rechazar</span>
                </label>
                <button class="boton-registro" type="submit">¡Registrarme!</button>
                <p class="login-texto">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
            </form>
        </div>
    </main>
</body>

</html>
